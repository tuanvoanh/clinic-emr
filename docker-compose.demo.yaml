services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////data/clinic.db
      SECRET_KEY: ${DEMO_SECRET_KEY:-demo-only-change-this-secret-key}
      FIRST_SUPERUSER_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@clinic.com}
      FIRST_SUPERUSER_PASSWORD: ${DEMO_ADMIN_PASSWORD:-adminpassword}
      FIRST_SUPERUSER_FULL_NAME: ${DEMO_ADMIN_NAME:-Demo Administrator}
    command: >-
      sh -c "alembic upgrade head &&
      python -m app.db.seed_demo &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${DEMO_BACKEND_PORT:-8000}:8000"
    volumes:
      - demo_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      NUXT_PUBLIC_API_BASE_URL: ${DEMO_API_URL:-http://localhost:8000}
      HOST: 0.0.0.0
      PORT: 3000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${DEMO_FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  demo_data:
